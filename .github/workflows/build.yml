name: build
on: [pull_request, push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build --stacktrace
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: AdminVanish
          path: build/libs/
      - name: dump signatures
        run: |
          JAR=~/.gradle/caches/fabric-loom/26.2/minecraft-merged.jar
          for c in net.minecraft.server.commands.ListPlayersCommand net.minecraft.server.PlayerAdvancements \
                   net.minecraft.world.level.block.entity.ContainerOpenersCounter net.minecraft.world.level.block.entity.ShulkerBoxBlockEntity \
                   net.minecraft.world.level.block.entity.ChestBlockEntity net.minecraft.world.level.block.entity.EnderChestBlockEntity \
                   net.minecraft.world.level.block.entity.BarrelBlockEntity net.minecraft.world.Container net.minecraft.world.entity.ContainerUser \
                   net.minecraft.server.players.PlayerList 'net.minecraft.world.level.gameevent.GameEvent$Context' net.minecraft.world.level.block.entity.LidBlockEntity; do
            echo "===== $c"; javap -p -cp "$JAR" "$c" | grep -vE 'lambda\$' || true
          done
          javap -p -cp "$JAR" net.minecraft.server.MinecraftServer | grep -iE 'status|playerCount|sample' || true
          javap -p -cp "$JAR" net.minecraft.server.level.ServerLevel | grep -iE 'sound|levelEvent|gameEvent|blockEvent' || true
          echo "===== bytecode"
          javap -c -p -cp "$JAR" net.minecraft.server.commands.ListPlayersCommand | grep -E 'invoke|static int format' || true
          javap -c -p -cp "$JAR" net.minecraft.world.level.block.entity.ContainerOpenersCounter | grep -E 'invoke|^  [a-z].*\(' || true
          javap -c -p -cp "$JAR" net.minecraft.server.MinecraftServer | sed -n '/buildPlayerStatus/,/^$/p' | grep -E 'invoke|Status' || true
