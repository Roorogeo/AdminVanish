name: build
on: [pull_request, push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build --stacktrace
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: AdminVanish
          path: build/libs/
      - name: dump minecraft signatures (temporary diagnostics)
        if: always()
        run: |
          JAR=$(find ~/.gradle .gradle -name 'minecraft-*.jar' -not -name '*sources*' 2>/dev/null | grep -E 'merged|common|server' | head -1)
          echo "jar: $JAR"
          find ~/.gradle .gradle -name 'minecraft-*.jar' 2>/dev/null | head -20
          for c in net.minecraft.server.permissions.Permissions net.minecraft.server.permissions.PermissionSet net.minecraft.commands.CommandSourceStack \
                   'net.minecraft.network.protocol.game.ClientboundPlayerInfoUpdatePacket$Entry' net.minecraft.network.protocol.game.ClientboundPlayerInfoUpdatePacket \
                   'net.minecraft.server.level.ChunkMap$TrackedEntity' net.minecraft.server.network.ServerCommonPacketListenerImpl \
                   net.minecraft.server.players.PlayerList net.minecraft.server.network.ServerGamePacketListenerImpl net.minecraft.server.level.ServerPlayer; do
            echo "===== $c"; javap -p -cp "$JAR" "$c" | grep -vE 'lambda\$' || true
          done
          javap -p -cp "$JAR" net.minecraft.server.level.ChunkMap | grep -E 'entityMap' || true
